name: Build and Send Firmware to Discord

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install cryptography

      - name: Rebuild Web Dashboard Header
        run: python build_html.py

      - name: Generate secrets.h from GitHub Secrets
        run: |
          cat << 'EOF' > ac_controller/secrets.h
          #pragma once
          #define WIFI_SSID "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASSWORD "${{ secrets.WIFI_PASSWORD }}"
          #define DEVICE_HOSTNAME "ac"
          #define USE_STATIC_IP 0
          #define STATIC_IP_ADDR 192, 168, 1, 150
          #define STATIC_GATEWAY 192, 168, 1, 1
          #define STATIC_SUBNET 255, 255, 255, 0
          #define STATIC_DNS1 1, 1, 1, 1
          #define STATIC_DNS2 8, 8, 8, 8
          EOF

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Core 3.3.8 & Libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
          arduino-cli lib install "IRremoteESP8266" "ArduinoJson"

      - name: Compile ESP32-C3 Firmware
        run: |
          mkdir -p build
          arduino-cli compile -b "esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs,FlashSize=4M" --output-dir build ac_controller
          cp build/ac_controller.ino.bin firmware.bin

      - name: Encrypt Firmware for Browser OTA (AES-256-GCM)
        id: encrypt
        env:
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD || secrets.WIFI_PASSWORD }}
        run: |
          python -c '
          import os, sys
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes

          pwd = os.environ.get("OTA_PASSWORD", "").strip()
          if not pwd:
              print("Warning: OTA_PASSWORD and WIFI_PASSWORD are empty, using default fallback key")
              pwd = "acmasterrace"

          salt = os.urandom(16)
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = kdf.derive(pwd.encode("utf-8"))

          iv = os.urandom(12)
          aesgcm = AESGCM(key)

          with open("firmware.bin", "rb") as f:
              plaintext = f.read()

          ciphertext = aesgcm.encrypt(iv, plaintext, None)

          with open("firmware.enc", "wb") as f:
              f.write(salt + iv + ciphertext)

          print(f"Encrypted firmware.bin ({len(plaintext)} bytes) -> firmware.enc ({len(salt) + len(iv) + len(ciphertext)} bytes)")
          '

      - name: Deploy Encrypted Firmware to builds Branch (CORS-friendly OTA)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/builds-deploy
          cp firmware.enc /tmp/builds-deploy/

          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)

          cat << EOF > /tmp/builds-deploy/version.json
          {
            "tag": "build-${COMMIT_SHORT}",
            "commit": "${{ github.sha }}",
            "message": "${COMMIT_MSG}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cd /tmp/builds-deploy
          git init
          git checkout -b builds
          git add firmware.enc version.json
          git commit -m "Auto-deploy encrypted build: ${COMMIT_SHORT}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin builds

      - name: Publish Encrypted Release Asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Cloud Build: ${{ github.sha }}"
          body: |
            Automated encrypted cloud build for ACMasterRace.
            * **Commit**: `${{ github.sha }}`
            * **Branch**: `${{ github.ref_name }}`
            * **Author**: `${{ github.actor }}`

            > **Notice**: The attached `firmware.enc` file is AES-256-GCM encrypted for private, authorized use by the device owner and collaborators. It can be decrypted and flashed directly through the ACMasterRace dashboard.
          files: firmware.enc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Binary to Private Discord Channel
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK secret not set. Skipping Discord notification."
            exit 0
          fi

          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)

          curl -s -S -X POST \
            -F "file=@firmware.bin;filename=firmware-${COMMIT_SHORT}.bin" \
            -F "payload_json={
              \"embeds\": [{
                \"title\": \"🚀 AC Controller Firmware Update Ready!\",
                \"description\": \"A new build has been compiled and is ready for Over-The-Air flashing.\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`${COMMIT_SHORT}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) - ${COMMIT_MSG}\", \"inline\": false},
                  {\"name\": \"Triggered By\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                  {\"name\": \"How to Flash\", \"value\": \"1. Download the attached \`.bin\` file\\n2. Go to **http://ac.local/update**\\n3. Drop file and click **Flash Firmware**\\n*Or use the 1-click Cloud Update inside the dashboard!*\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"ACMasterRace Private Cloud Builder\"},
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "$DISCORD_WEBHOOK"

      - name: Upload Binary Artifact (for direct download)
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-firmware
          path: firmware.bin
          if-no-files-found: error
